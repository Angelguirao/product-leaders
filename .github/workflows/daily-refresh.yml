name: Daily refresh

on:
  schedule:
    # Every day at 07:00 UTC
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Max new briefs to generate this run"
        required: false
        default: "8"

concurrency:
  group: product-leaders-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install yt-dlp
        run: |
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp
          yt-dlp --version

      - name: Install npm deps + summarize
        run: |
          npm ci
          npm install -g @steipete/summarize

      - name: Refresh catalog, briefs, index
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PL_BRIEF_MODEL: ${{ vars.PL_BRIEF_MODEL }}
          PL_PROCESS_LIMIT: ${{ github.event.inputs.limit || '8' }}
        run: npm run refresh -- --limit "${PL_PROCESS_LIMIT}"

      - name: Audit published cards
        run: npm run audit-cards

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog episodes companies public/og src/data
          if git diff --staged --quiet; then
            echo "No catalog/brief changes."
            exit 0
          fi
          git commit -m "chore: daily catalog and brief refresh"
          git push
